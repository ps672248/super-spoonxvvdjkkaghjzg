name: Seed Question Bank

on:
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour (UTC)
  workflow_dispatch:
    inputs:
      topics_per_run:
        description: 'How many topics to seed this run'
        required: false
        default: '12'

# Don't let an overrunning seed collide with the next hourly trigger.
concurrency:
  group: seed-questions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install script deps
        working-directory: ./scripts
        run: npm install

      - name: Seed questions
        working-directory: ./scripts
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SEED_TOPICS_PER_RUN: ${{ github.event.inputs.topics_per_run || '12' }}
        run: npm run seed
