name: YouTube Comment Bot

on:
  schedule:
    - cron: '45 11 * * *'   # 5:15 PM IST (11:45 UTC) daily — comment bots staggered 1h apart
  workflow_dispatch:         # allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 50      # setup + 40-min bot cap (in-shell, see run step) + save step headroom

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: marketing/youtube/requirements.txt

      - name: Install dependencies
        run: pip install -r marketing/youtube/requirements.txt

      - name: Write credentials from secrets
        working-directory: marketing/youtube
        run: |
          echo '${{ secrets.YT_CLIENT_SECRET }}' > client_secret.json
          echo '${{ secrets.YT_TOKEN }}' > token.json

      - name: Run bot
        working-directory: marketing/youtube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 40-min cap enforced in-shell: exit 124 = planned cutoff, NOT a
          # failure. History is saved incrementally by the bot, so a capped
          # run that wrote history counts as SUCCESS and the job stays green.
          # Real crashes keep their nonzero exit and still fail the job.
          set +e
          timeout --signal=INT --kill-after=60 40m python bot.py
          code=$?
          if [ $code -eq 124 ] || [ $code -eq 137 ]; then
            echo "Bot hit the 40-minute cap - planned cutoff, treating as success."
            exit 0
          fi
          exit $code

      - name: Save updated history back to repo
        if: always()
        working-directory: marketing/youtube
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add psu_history.json
          git diff --staged --quiet || git commit -m "chore: update psu bot history [skip ci]"
          git push

      # refresh_token never expires for verified apps used regularly.
      # google-auth auto-refreshes the access token each run — no secret update needed.
