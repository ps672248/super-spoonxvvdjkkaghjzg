name: YouTube Comment Bot

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours (12 runs/day)
  workflow_dispatch:         # allow manual trigger from GitHub Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 40      # 3 comments + 3 replies with delays ~30 min max

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth-oauthlib google-generativeai python-dotenv

      - name: Write credentials from secrets
        working-directory: marketing/youtube
        run: |
          echo '${{ secrets.YT_CLIENT_SECRET }}' > client_secret.json
          echo '${{ secrets.YT_TOKEN }}' > token.json

      - name: Run bot
        working-directory: marketing/youtube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Save updated history back to repo
        working-directory: marketing/youtube
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || git commit -m "chore: update youtube bot history [skip ci]"
          git push

      # refresh_token never expires for verified apps used regularly.
      # google-auth auto-refreshes the access token each run — no secret update needed.
