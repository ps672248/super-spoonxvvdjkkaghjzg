name: Seed Leaderboard

on:
  schedule:
    - cron: '30 1 * * *'   # daily 01:30 UTC — offset from other crons
  workflow_dispatch:

concurrency:
  group: seed-leaderboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install script deps
        working-directory: ./scripts
        run: npm install

      - name: Seed leaderboard
        working-directory: ./scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run seed:lb
